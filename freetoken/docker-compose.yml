services:
  daemon:
    build: .
    ipc: host
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /root/.cache/huggingface
      XDG_CACHE_HOME: /root/.cache
      FREETOKEN_DAEMON_TOKEN: ${FREETOKEN_DAEMON_TOKEN:-local-proxy-token}
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - daemon_state:/root/.freetoken/daemon
      - benchbw_cache:/root/.cache/freetoken
    command: ["ft", "daemon", "--host", "0.0.0.0", "--port", "19000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:19000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - engine

  proxy:
    build: ./proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FT_PROXY_PORT:-11435}:11434"
    depends_on:
      daemon:
        condition: service_healthy
    environment:
      FT_DAEMON_URL: http://daemon:19000
      FT_SERVE_URL: http://daemon:1919
      FT_DAEMON_TOKEN: ${FREETOKEN_DAEMON_TOKEN:-local-proxy-token}
      FT_MODEL_CATALOG: /app/models.json
      FT_IDLE_SECONDS: ${FT_IDLE_SECONDS:-300}
      FT_START_TIMEOUT_SECONDS: ${FT_START_TIMEOUT_SECONDS:-900}
    volumes:
      - ./models.json:/app/models.json:ro
    networks:
      engine:
      proxy:
        aliases:
          - freetoken-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.freetoken.rule=Host(`freetoken.lab.wilgnne.dev`)"
      - "traefik.http.routers.freetoken.entrypoints=websecure"
      - "traefik.http.routers.freetoken.tls=true"
      - "traefik.http.routers.freetoken.service=freetoken"
      - "traefik.http.services.freetoken.loadbalancer.server.port=11434"
      - "traefik.docker.network=proxy"

volumes:
  huggingface_cache:
  daemon_state:
  benchbw_cache:

networks:
  engine:
  proxy:
    external: true
    name: proxy
