services:
  herdr:
    build: .
    restart: unless-stopped
    init: true
    volumes:
      - herdr-home:/home/herdr
      - herdr-workspaces:/home/herdr/workspaces
      - herdr-host-keys:/var/lib/herdr-ssh
      - type: bind
        source: ${HERDR_AUTHORIZED_KEYS_FILE:-./authorized_keys}
        target: /run/herdr/authorized_keys
        read_only: true
        bind:
          create_host_path: false
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.tcp.routers.herdr-ssh.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.herdr-ssh.entrypoints=${HERDR_SSH_ENTRYPOINT:-herdr-ssh}"
      - "traefik.tcp.routers.herdr-ssh.service=herdr-ssh"
      - "traefik.tcp.services.herdr-ssh.loadbalancer.server.port=22"

volumes:
  herdr-home:
  herdr-workspaces:
  herdr-host-keys:

networks:
  proxy:
    external: true
    name: proxy
