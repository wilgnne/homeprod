x-outline-resources: &outline-resources
  limits:
    cpus: "${OUTLINE_CPU_LIMIT:-1.00}"
    memory: "${OUTLINE_MEMORY_LIMIT:-1G}"
  reservations:
    cpus: "${OUTLINE_CPU_RESERVATION:-0.25}"
    memory: "${OUTLINE_MEMORY_RESERVATION:-512M}"

x-database-resources: &database-resources
  limits:
    cpus: "${POSTGRES_CPU_LIMIT:-1.00}"
    memory: "${POSTGRES_MEMORY_LIMIT:-1G}"
  reservations:
    cpus: "${POSTGRES_CPU_RESERVATION:-0.25}"
    memory: "${POSTGRES_MEMORY_RESERVATION:-256M}"

x-redis-resources: &redis-resources
  limits:
    cpus: "${REDIS_CPU_LIMIT:-0.25}"
    memory: "${REDIS_MEMORY_LIMIT:-256M}"
  reservations:
    cpus: "${REDIS_CPU_RESERVATION:-0.05}"
    memory: "${REDIS_MEMORY_RESERVATION:-64M}"

services:
  outline:
    image: docker.getoutline.com/outlinewiki/outline:${OUTLINE_RELEASE:-1.9.0}
    env_file:
      - ./.env
    expose:
      - "3000"
    volumes:
      - storage_data:/var/lib/outline/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources: *outline-resources
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.outline.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.outline.entrypoints=websecure"
      - "traefik.http.routers.outline.tls=true"
      - "traefik.http.routers.outline.service=outline"
      - "traefik.http.services.outline.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy"

  postgres:
    image: postgres:${POSTGRES_RELEASE:-18-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources: *database-resources
    networks:
      - internal

  redis:
    image: redis:${REDIS_RELEASE:-8-alpine}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources: *redis-resources
    networks:
      - internal

volumes:
  storage_data:
  database_data:
  redis_data:

networks:
  internal:
    internal: true
  proxy:
    external: true
    name: proxy
